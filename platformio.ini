[env:camera_unit]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
build_src_filter = +<camera.cpp>
monitor_speed = 115200
build_flags = 
	-D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps = 
	jgromes/RadioLib@^7.7.1
	olikraus/U8g2@^2.36.18

[env:remote_unit]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
build_src_filter = +<remote.cpp>
monitor_speed = 115200
build_flags = 
	-D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps = 
	jgromes/RadioLib@^7.7.1
	olikraus/U8g2@^2.36.18